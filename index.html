<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Private</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; }
form { width: min(320px, 90vw); text-align: center; }
input[type=password], button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #8884; font: inherit; box-sizing: border-box; }
label { display: block; font-size: 12px; opacity: .7; margin: 10px 0; }
#err { min-height: 20px; font-size: 13px; margin-top: 10px; color: #d03b3b; }
</style>
</head>
<body>
<form id="lock" hidden>
  <input type="password" id="key" placeholder="Secret key" autocomplete="current-password" autofocus>
  <label><input type="checkbox" id="remember" checked> Remember on this device</label>
  <button type="submit">Unlock</button>
  <div id="err"></div>
</form>
<script>
// Wrapped so nothing here stays global: the dashboard page is written into this same window.
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function decrypt(box, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(box.salt), iterations: box.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.data))));
}
function show(payload) {
  window.__DATA = payload.data;
  document.open(); document.write(payload.html); document.close();
}
(async () => {
  const box = await fetch("data.enc.json", { cache: "no-store" }).then((r) => r.json());
  const saved = localStorage.getItem("k");
  if (saved) { try { return show(await decrypt(box, saved)); } catch { localStorage.removeItem("k"); } }
  $("lock").hidden = false;
  $("lock").onsubmit = async (e) => {
    e.preventDefault();
    $("err").textContent = "Checking…";
    try {
      const payload = await decrypt(box, $("key").value);
      if ($("remember").checked) localStorage.setItem("k", $("key").value);
      show(payload);
    } catch { $("err").textContent = "That key didn't work."; }
  };
})();
})();
</script>
</body>
</html>
